<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Градієнт для тла -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Градієнт для активної картки/знака -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Тінь -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Скруглений фоновий квадрат -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>

  <!-- Задня карта (комп'ютер / менше число) -->
  <g filter="url(#shadow)" transform="rotate(-12 26 34)">
    <rect x="14" y="16" width="24" height="34" rx="5" fill="#38bdf8" stroke="#0284c7" stroke-width="1.5"/>
    <text x="26" y="38" font-family="system-ui, sans-serif" font-weight="900" font-size="16" fill="#0f172a" text-anchor="middle">7</text>
  </g>

  <!-- Передня карта (виграшна / більше число) -->
  <g filter="url(#shadow)" transform="rotate(8 38 34)">
    <rect x="26" y="14" width="24" height="34" rx="5" fill="#facc15" stroke="#eab308" stroke-width="1.5"/>
    <text x="38" y="36" font-family="system-ui, sans-serif" font-weight="900" font-size="16" fill="#0f172a" text-anchor="middle">9</text>
  </g>

  <!-- Символ ">" (Більше) по центру знизу -->
  <path d="M 26 46 L 36 51 L 26 56" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)"/>
</svg>
